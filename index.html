<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ELECTROHACK 2.0 | Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
      }

      @keyframes flow {
        from { stroke-dashoffset: 300; }
        to { stroke-dashoffset: 0; }
      }
      
      .circuit-line {
        stroke-dasharray: 40, 260;
        animation: flow 5s linear infinite;
        stroke-linecap: round;
      }

      .fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse-amber {
        0%, 100% {
          color: white;
          transform: scale(1);
        }
        50% {
          color: #f59e0b;
          transform: scale(1.1);
        }
      }

      .highlight-pulse {
          animation: pulse-amber 1s ease-in-out;
      }

      @keyframes spark-burst {
        0% { transform: scale(0.5); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1.2); opacity: 0; }
      }
      @keyframes spark-draw {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
      .spark {
        animation: spark-burst 0.5s ease-out forwards;
        transform-origin: center;
      }
      .spark polyline {
        stroke-dasharray: 20;
        animation: spark-draw 0.3s ease-out forwards;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 10px;
      }

      input[type=number] {
        -moz-appearance: textfield;
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

    "mongoose": "https://esm.sh/mongoose@^9.1.5",
    "cors": "https://esm.sh/cors@^2.8.6",
    "path": "https://esm.sh/path@^0.12.7",
    "dotenv": "https://esm.sh/dotenv@^17.2.3",

  }
}
</script>

</head>

</html>
